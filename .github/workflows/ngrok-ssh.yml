name: Cloudflare SSH Tunnel

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    
    steps:
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPuBRRWPeEzGzSajoJXoZO2ERMFErvU0iDeLmYuPYK7o u0_a317@localhost" >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        sudo apt-get update
        sudo apt-get install -y openssh-server
        sudo systemctl start ssh

    - name: Install Cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

    - name: Start Tunnel
      run: |
        cloudflared tunnel --url ssh://localhost:22 &
        sleep 10
        URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*\.trycloudflare\.com' | head -1)
        
        echo "========================================="
        echo "🔐 SSH CONNECTION DETAILS"
        echo "========================================="
        echo ""
        echo "🌐 Cloudflare URL: $URL"
        echo ""
        echo "📱 Connect from Termux:"
        echo "   ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" runner@$URL"
        echo ""
        echo "========================================="

    - name: Keep Alive
      run: sleep 28800

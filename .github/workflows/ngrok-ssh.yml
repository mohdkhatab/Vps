name: SSH Tunnel (No Token Needed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          # Ye line timeout ko kam karke 4 minute kar degi
          connect-timeout-seconds: 240

name: ngrok SSH Access

on:
  workflow_dispatch:

jobs:
  ngrok-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    
    steps:
    - name: Setup SSH Server
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPuBRRWPeEzGzSajoJXoZO2ERMFErvU0iDeLmYuPYK7o u0_a317@localhost" >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        sudo apt-get update -qq
        sudo apt-get install -y -qq openssh-server
        sudo systemctl start ssh

    - name: Install ngrok
      run: |
        wget -q https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
        unzip -q ngrok-stable-linux-amd64.zip
        sudo mv ngrok /usr/local/bin/
        rm ngrok-stable-linux-amd64.zip
        ngrok config add-authtoken "2zBxl1Rf6s8s4TcaqMhkOmDoK97_8gn65VaDxGDKTFdeUGxq"

    - name: Start ngrok Tunnel
      run: |
        ngrok tcp 22 --region in &
        sleep 8
        URL=$(curl -s http://localhost:4040/api/tunnels | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    tunnels = data.get('tunnels', [])
    if tunnels:
        print(tunnels[0]['public_url'])
except:
    print('')
")
        if [ -n "$URL" ]; then
          echo "========================================="
          echo "🔐 SSH CONNECTION DETAILS"
          echo "========================================="
          echo ""
          echo "🌐 Public URL: $URL"
          echo ""
          HOST=$(echo $URL | cut -d'@' -f2 | cut -d':' -f1)
          PORT=$(echo $URL | cut -d':' -f3)
          echo "📱 Connect from Termux:"
          echo "   ssh -p $PORT runner@$HOST"
          echo ""
          echo "========================================="
        else
          echo "❌ Failed to get tunnel URL"
          exit 1
        fi

    - name: Keep Session Alive
      run: |
        echo "✅ Session is active!"
        echo ""
        TIMEOUT=28800
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          HOURS=$((ELAPSED / 3600))
          MINS=$(((ELAPSED % 3600) / 60))
          echo "[$(date '+%H:%M:%S')] Active - ${HOURS}h ${MINS}m elapsed"
          sleep 60
          ELAPSED=$((ELAPSED + 60))
        done

    - name: Cleanup
      if: always()
      run: |
        sudo systemctl stop ssh || true
        pkill ngrok || true
        echo "✅ Cleanup complete"

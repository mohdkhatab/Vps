name: Temporary SSH VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-vm:
    name: Start Temporary Ubuntu VM
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Show system information
        run: |
          echo "Temporary Ubuntu VM is ready"
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          df -h /

      - name: Install SSH and tmate
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl wget unzip zip nano vim tmux htop net-tools python3-pip tmate

      - name: Start SSH session
        shell: bash
        run: |
          set -euo pipefail
          SOCKET=/tmp/tmate.sock
          rm -f "$SOCKET"
          timeout 10s tmate -S "$SOCKET" new-session -d

          SSH_CMD=""
          WEB_URL=""
          for attempt in $(seq 1 30); do
            SSH_CMD=$(timeout 5s tmate -S "$SOCKET" display -p '#{tmate_ssh}' 2>/dev/null || true)
            WEB_URL=$(timeout 5s tmate -S "$SOCKET" display -p '#{tmate_web}' 2>/dev/null || true)
            if [[ "$SSH_CMD" == ssh\ * ]]; then
              break
            fi
            sleep 2
          done

          if [[ "$SSH_CMD" != ssh\ * ]]; then
            echo "ERROR: tmate did not provide an SSH command"
            timeout 5s tmate -S "$SOCKET" show-messages || true
            exit 1
          fi

          echo "========================================="
          echo "SSH CONNECTION DETAILS"
          echo "========================================="
          echo "SSH: $SSH_CMD"
          echo "WEB: $WEB_URL"
          echo "========================================="

      - name: Keep VM alive
        shell: bash
        run: |
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] VM is alive"
            sleep 60
          done

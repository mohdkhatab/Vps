name: Temporary SSH VM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-vm:
    name: Start Temporary Ubuntu VM
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Start SSH session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false
          connect-timeout-seconds: 120

      - name: Print SSH details
        run: |
          echo "========================================="
          echo "SSH CONNECTION DETAILS"
          echo "========================================="
          echo "SSH: ${{ steps.tmate.outputs.ssh-command }}"
          echo "WEB: ${{ steps.tmate.outputs.web-url }}"
          echo "========================================="

      - name: Keep VM alive
        shell: bash
        run: |
          while true; do
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] VM is alive"
            sleep 60
          done

name: SSH Remote Access

on:
  workflow_dispatch:
    inputs:
      session_timeout:
        description: "Session timeout (minutes)"
        required: false
        default: "480"
      ssh_public_key:
        description: "Your SSH Public Key"
        required: false
        default: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPuBRRWPeEzGzSajoJXoZO2ERMFErvU0iDeLmYuPYK7o u0_a317@localhost"

permissions:
  contents: read

jobs:
  ssh-access:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    
    steps:
    - name: Setup SSH Server
      run: |
        echo "🔧 Setting up SSH..."
        
        # Setup SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Add your public key
        echo "${{ inputs.ssh_public_key }}" >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        
        # Install SSH server (minimal)
        sudo apt-get update -qq
        sudo apt-get install -y -qq openssh-server
        
        # Start SSH
        sudo systemctl start ssh
        
        # Get IP
        IP=$(curl -s ifconfig.me)
        USER=$(whoami)
        
        echo "====================================="
        echo "🔐 SSH CONNECTION DETAILS"
        echo "====================================="
        echo "IP: $IP"
        echo "User: $USER"
        echo "Port: 22"
        echo ""
        echo "Connect from Termux:"
        echo "ssh $USER@$IP -p 22"
        echo "====================================="
        
        # Save to GitHub env
        echo "SSH_IP=$IP" >> $GITHUB_ENV
        echo "SSH_USER=$USER" >> $GITHUB_ENV
        
    - name: Keep Session Alive
      run: |
        echo "✅ SSH Server Running"
        echo "Connect: ssh $SSH_USER@$SSH_IP -p 22"
        echo ""
        echo "Session timeout: ${{ inputs.session_timeout }} minutes"
        echo ""
        
        # Keep running
        TIMEOUT=$(( ${{ inputs.session_timeout }} * 60 ))
        ELAPSED=0
        
        while [ $ELAPSED -lt $TIMEOUT ]; do
          echo "[$(date '+%H:%M:%S')] Active - $(( ($TIMEOUT - $ELAPSED) / 60 )) min left"
          sleep 60
          ELAPSED=$((ELAPSED + 60))
        done
        
    - name: Cleanup
      if: always()
      run: |
        sudo systemctl stop ssh || true
        echo "✅ Cleanup done"

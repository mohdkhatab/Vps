name: tmate Remote Access

on:
  workflow_dispatch:
    inputs:
      session_timeout:
        description: "Session timeout (minutes)"
        required: false
        default: "480"

permissions:
  contents: read

jobs:
  tmate:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    
    steps:
    - name: Setup tmate
      run: |
        echo "📡 Setting up tmate..."
        
        # Download tmate
        wget -q https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.gz
        tar -xzf tmate-2.4.0-static-linux-amd64.tar.gz
        sudo mv tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/tmate
        rm -rf tmate-2.4.0-static-linux-amd64 tmate-2.4.0-static-linux-amd64.tar.gz
        
        echo "✅ tmate installed"
        
    - name: Start tmate session
      run: |
        echo "========================================="
        echo "🔐 TMATE CONNECTION DETAILS"
        echo "========================================="
        echo ""
        echo "Starting tmate session..."
        echo ""
        
        # Start tmate and capture output
        tmate -F 2>&1 | while read line; do
          echo "$line"
          
          # Capture SSH connection
          if echo "$line" | grep -q "ssh session:"; then
            SSH_CMD=$(echo "$line" | grep -o "ssh .*@.*")
            echo "SSH_CMD=$SSH_CMD" >> $GITHUB_ENV
            echo "$SSH_CMD" > /tmp/ssh_cmd.txt
          fi
          
          # Capture Web URL
          if echo "$line" | grep -q "web session:"; then
            WEB_URL=$(echo "$line" | grep -o "https://tmate.io/t/.*")
            echo "WEB_URL=$WEB_URL" >> $GITHUB_ENV
            echo "$WEB_URL" > /tmp/web_url.txt
          fi
        done &
        
        # Wait for tmate to start
        sleep 10
        
        # Display connection info
        echo ""
        echo "========================================="
        echo "🔐 CONNECTION INFO"
        echo "========================================="
        echo ""
        
        if [ -f /tmp/ssh_cmd.txt ]; then
          echo "📱 SSH CONNECTION:"
          echo "   $(cat /tmp/ssh_cmd.txt)"
          echo ""
        fi
        
        if [ -f /tmp/web_url.txt ]; then
          echo "🌐 WEB TERMINAL:"
          echo "   $(cat /tmp/web_url.txt)"
          echo ""
        fi
        
        echo "⏱️ Session timeout: ${{ inputs.session_timeout }} minutes"
        echo "========================================="
        echo ""
        echo "✅ Session is active!"
        
    - name: Keep Session Alive
      run: |
        echo "🔄 Keeping session alive..."
        echo "Press Ctrl+C to stop"
        echo ""
        
        TIMEOUT=$(( ${{ inputs.session_timeout }} * 60 ))
        ELAPSED=0
        
        while [ $ELAPSED -lt $TIMEOUT ]; do
          echo "[$(date '+%H:%M:%S')] Active - $(( ($TIMEOUT - $ELAPSED) / 60 )) min remaining"
          sleep 60
          ELAPSED=$((ELAPSED + 60))
        done
        
    - name: Cleanup
      if: always()
      run: |
        pkill -f tmate || true
        echo "✅ Cleanup complete"
